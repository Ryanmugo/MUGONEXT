services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mugonext-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:MugoPostgres2026@postgres:5432/mugonext
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: mugonext-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MugoPostgres2026
      POSTGRES_DB: mugonext
    ports:
      - "5432:5432"
    volumes:
      - mugonext_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mugonext"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mugonext_postgres_data:
